name: mytennat
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_analytics: ^12.4.2

  flutter_local_notifications: ^22.0.0

  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  image_picker: ^1.2.2
  lottie: ^3.3.3
  intl: ^0.20.2
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_places_flutter: ^2.1.0
  google_maps_flutter: ^2.12.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/banners/
    - assets/cities/