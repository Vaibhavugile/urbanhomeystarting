name: mytennat
description: "A new Flutter project."
publish_to: 'none'

version: 8.0.0+20

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.10.0
  firebase_auth: ^6.5.2
  cloud_firestore: ^6.5.0
  firebase_storage: ^13.4.2
  firebase_messaging: ^16.3.0
  firebase_analytics: ^12.4.2
  cloud_functions: 6.3.2

  flutter_local_notifications: ^22.0.0

  google_fonts: ^8.1.0
  provider: ^6.1.5+1
  image_picker: ^1.2.2
  lottie: ^3.3.3
  intl: ^0.20.2
  rxdart: ^0.28.0
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  google_places_flutter: ^2.1.0
  google_maps_flutter: ^2.12.3
  smooth_page_indicator: ^1.2.1
  photo_view: ^0.15.0
  flutter_card_swiper: ^7.1.0
  flutter_image_compress: ^2.4.0
  path_provider: ^2.1.5
  in_app_purchase: ^3.2.3
  in_app_purchase_android: ^0.4.0+3
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3


flutter:
  uses-material-design: true

  assets:
    - assets/lottie/
    - assets/images/
    - assets/banners/
    - assets/cities/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"